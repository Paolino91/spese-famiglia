[build]
  publish = "."
  command = "echo nessuna build necessaria"
  # Risparmio crediti: Netlify ripubblica SOLO se cambia la parte server (sincronizzazione).
  # Le modifiche all'app (grafica, testi) vanno online da GitHub Pages senza consumare crediti.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml package.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/merge.js"
  [headers.values]
    Cache-Control = "no-cache"
